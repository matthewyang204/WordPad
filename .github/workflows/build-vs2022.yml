# separate terms of service, privacy policy, and support
# documentation.

name: Build with Visual Studio 2022

on:
  push:
    branches: [ "master", "testing" ]
  pull_request:
    branches: [ "master", "testing" ]
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: src/WordPad-vs2022.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2
    
    - name: Download exeosver
      run: |
        curl -LO https://github.com/camthesaxman/exeosver/releases/download/1.0/exeosver.exe

    # - name: Restore NuGet packages
    #   working-directory: ${{env.GITHUB_WORKSPACE}}
    #   run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}
    
    - name: Exeosver the build
      run: |
        .\exeosver.exe src\Release\WordPad.exe

    - name: Build Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer/wordpad-x86-setup.iss

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: WordPad-Installer-Output
        path: installer/Output

    - name: Upload other build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: WordPad-Src-Build-Folder
        path: src
